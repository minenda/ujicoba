<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pembayaran Baru</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>

    body{
      background:#f5f6fa;
      font-family:'Segoe UI', sans-serif;
    }

    /* HEADER */
    .topbar{
      background:#0d6efd;
      color:white;
      padding:20px;
      padding-top:40px;
      border-bottom-left-radius:22px;
      border-bottom-right-radius:22px;
      box-shadow:0 3px 10px rgba(0,0,0,0.08);
    }

    .topbar a{
      color:white;
      text-decoration:none;
    }

    .topbar h4{
      font-weight:700;
      margin:0;
    }

    .topbar i{
      font-size:28px;
    }

    /* CARD SISWA */
    .student-card{
      background:white;
      border-radius:22px;
      padding:18px;
      box-shadow:0 3px 10px rgba(0,0,0,0.05);
      margin-bottom:28px;
    }

    .student-img{
      width:90px;
      height:90px;
      border-radius:18px;
      object-fit:cover;
    }

    .student-name{
      font-size:22px;
      font-weight:700;
      margin-bottom:4px;
    }

    .student-course{
      color:#555;
      font-size:18px;
      margin-bottom:3px;
    }

    .student-phone{
      color:#777;
      font-size:17px;
    }

    /* FORM */
    .form-label{
      font-weight:700;
      font-size:18px;
      margin-bottom:10px;
    }

    .form-control,
    .form-select{
      border-radius:16px;
      min-height:58px;
      font-size:20px;
      border:1px solid #e3e3e3;
      box-shadow:none !important;
    }

    .readonly-input{
      background:#f3f4fb;
      color:#0d6efd;
      font-weight:700;
    }

    /* METODE BAYAR */
    .payment-method{
      display:flex;
      gap:12px;
    }

    .method-btn{
      flex:1;
      border:1.8px solid #e3e3e3;
      background:white;
      border-radius:16px;
      padding:14px;
      font-weight:700;
      font-size:18px;
      transition:0.2s;
    }

    .method-btn.active{
      border-color:#0d6efd;
      color:#0d6efd;
      background:#f4f8ff;
    }

    /* BUTTON */
    .btn-save{
      background:#0d6efd;
      border:none;
      width:100%;
      min-height:60px;
      border-radius:18px;
      color:white;
      font-size:22px;
      font-weight:700;
      box-shadow:0 5px 14px rgba(13,110,253,0.3);
    }

    .btn-save:hover{
      background:#0b5ed7;
    }

    @media(max-width:576px){

      .student-name{
        font-size:20px;
      }

      .student-course,
      .student-phone{
        font-size:15px;
      }

      .form-control,
      .form-select{
        font-size:18px;
      }

      .method-btn{
        font-size:16px;
        padding:12px;
      }

      .btn-save{
        font-size:20px;
      }

    }

  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="topbar">

    <div class="d-flex align-items-center">

      <a href="dataSiswa.html" class="d-flex align-items-center">

        <i class="bi bi-arrow-left me-3"></i>

        <h4>Data Siswa</h4>

      </a>

    </div>

  </div>

  <div class="container py-4">

    <!-- CARD SISWA -->
    <div class="student-card">

      <div class="d-flex align-items-center">

        <img src="https://randomuser.me/api/portraits/boys/1.jpg"
             class="student-img me-3">

        <div>

          <div class="student-name">
            Ahmad Syarif
          </div>

          <div class="student-course">
            English for Kids - Level 1
          </div>

          <div class="student-phone">
            WA: 0812-1234-5678
          </div>

        </div>

      </div>

    </div>

    <!-- FORM -->
    <form>

      <!-- BULAN -->
      <div class="mb-4">

        <label class="form-label">
          Bulan Tagihan
        </label>

        <select class="form-select">
          <option>Mei 2026</option>
          <option>Juni 2026</option>
          <option>Juli 2026</option>
        </select>

      </div>

      <!-- JUMLAH -->
      <div class="mb-4">

        <label class="form-label">
          Jumlah Tagihan
        </label>

        <input type="text"
               class="form-control"
               value="Rp300.000">

      </div>

      <!-- DISKON -->
      <div class="mb-4">

        <label class="form-label">
          Diskon
        </label>

        <input type="text"
               class="form-control"
               value="Rp0">

      </div>

      <!-- JUMLAH BAYAR -->
      <div class="mb-4">

        <label class="form-label">
          Jumlah Bayar
        </label>

        <input type="text"
               class="form-control readonly-input"
               value="Rp300.000">

      </div>

      <!-- METODE -->
      <div class="mb-4">

        <label class="form-label">
          Metode Bayar
        </label>

        <div class="payment-method">

          <button type="button"
                  class="method-btn active">
            Tunai
          </button>

          <button type="button"
                  class="method-btn">
            Transfer
          </button>

          <button type="button"
                  class="method-btn">
            QRIS
          </button>

        </div>

      </div>

      <!-- TANGGAL -->
      <div class="mb-4">

        <label class="form-label">
          Tanggal Bayar
        </label>

        <div class="position-relative">

          <input type="date"
                 class="form-control"
                 value="2026-05-21">

        </div>

      </div>

      <!-- CATATAN -->
      <div class="mb-4">

        <label class="form-label">
          Catatan (opsional)
        </label>

        <input type="text"
               class="form-control"
               placeholder="Contoh: Via BCA">

      </div>

      <!-- BUTTON -->
      <button class="btn-save">
        Simpan Pembayaran
      </button>

    </form>

  </div>

</body>
</html>
